name: Verify VexStream Android Mobile Player

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vexstream-mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-vexstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Android branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build VexStream Android APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VexLife-Android-VexStream-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run source and unit verification
        run: |
          ./gradlew \
            :app:verifySourceAlignment \
            :architecture:elements:test \
            :architecture:logging:test \
            :app:testDebugUnitTest \
            --no-configuration-cache \
            --stacktrace

      - name: Preserve unit-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VexLife-Android-Unit-Test-Diagnostics
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/vex/
          if-no-files-found: ignore
          retention-days: 3
