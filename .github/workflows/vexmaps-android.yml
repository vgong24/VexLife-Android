name: Verify VexMaps Android

on:
  pull_request:
    paths:
      - ".github/workflows/vexmaps-android.yml"
      - "app/build.gradle.kts"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/main/kotlin/com/vextreme/vexlife/android/screens/shared/maps/**"
      - "app/src/test/kotlin/com/vextreme/vexlife/android/screens/shared/maps/**"
      - "app/src/journeyTest/kotlin/com/vextreme/vexlife/android/testing/journey/**"
      - "gradle/libs.versions.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vexmaps-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-vexmaps:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify VexMaps source and deterministic contracts
        run: |
          ./gradlew \
            :app:verifySourceAlignment \
            :architecture:elements:test \
            :architecture:logging:test \
            :architecture:relay:test \
            :app:testDebugUnitTest \
            --no-configuration-cache \
            --stacktrace

      - name: Build Android debug APK
        run: |
          ./gradlew \
            :app:assembleDebug \
            --no-configuration-cache \
            --stacktrace

      - name: Preserve VexMaps diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VexMaps-Android-Diagnostics
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/vex/
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve VexMaps debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VexMaps-Android-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
