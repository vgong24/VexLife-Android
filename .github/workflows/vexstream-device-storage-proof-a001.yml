name: VexStream device storage proof A001

on:
  push:
    branches:
      - VXG-102226-vexstream-device-storage

permissions:
  contents: write

concurrency:
  group: vexstream-device-storage-proof-a001
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify repository source and compile Android instrumentation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew vexVerifyLocal :app:assembleDebugAndroidTest --no-configuration-cache --continue --stacktrace

      - name: Remove proof carrier after green verification
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/vexstream-device-storage-proof-a001.yml
          git config user.name "VexGPT"
          git config user.email "victor.gong@vextreme24.com"
          git commit -m "[VexStream Proof] Retire device-storage proof carrier" -m "Repository-owned local verification and Android instrumentation compilation passed; remove the temporary proof workflow from the candidate tree." -m "[VXG RealForever]"
          git push origin HEAD:VXG-102226-vexstream-device-storage
