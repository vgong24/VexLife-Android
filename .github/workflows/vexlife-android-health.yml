name: Verify VexLife Android Repository Health

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vexlife-android-health-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run repository-owned local verification
        run: ./gradlew vexVerifyLocal --no-configuration-cache --continue --stacktrace

      - name: Preserve foundation health and JVM diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VexLife-Android-Repository-Health
          path: |
            build/vex/test-foundation/foundation-health.txt
            app/build/reports/vex/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            architecture/*/build/test-results/
            architecture/*/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
